[project]
name = "cv-ats"
version = "0.1.0"
description = "Editor y validador de hojas de vida con exportación ATS y diseño"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic[email]>=2.8",
  "pydantic-settings>=2.4",
  "weasyprint>=62",
  "python-docx>=1.1",
  "pdfplumber>=0.11",
  "scikit-learn>=1.5",
  "pillow>=10",
  "typer>=0.12",
]

[project.scripts]
cv-ats = "app.cli:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
  "pre-commit>=3.8",
  "types-python-dateutil",
]
pdf-fallback = ["playwright>=1.46"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "app", "models", "schemas", "services", "validator", "render",
  "export", "importer", "match",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["static/vendor", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "SIM", "RUF"]
ignore = ["S101"]  # assert en tests
# El contrato de render usa guion "–" (en dash) y separador "·" en textos.
allowed-confusables = ["–", "·"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]  # migraciones autogeneradas (revisadas a mano)
"tests/*" = ["S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = [
  "app", "models", "validator", "export", "importer", "services", "schemas", "render",
  "match",
]

[[tool.mypy.overrides]]
module = ["weasyprint", "weasyprint.*", "sklearn", "sklearn.*"]
ignore_missing_imports = true  # WeasyPrint no publica tipos (py.typed)

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
