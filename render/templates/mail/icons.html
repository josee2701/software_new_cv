{#- Iconos SVG inline para la plantilla mail. WeasyPrint 70 no aplica CSS externo ni
    currentColor a SVG inline: el trazo va fijo en blanco y el círculo de fondo lo pinta el CSS
    del tema (.ico → var(--icon-bg)). viewBox 24x24, trazo 2. -#}
{%- macro icon(name) -%}
<svg class="ico-svg" viewBox="0 0 24 24" width="9" height="9" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{%- if name == "email" -%}
<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3.5 6.5 12 13l8.5-6.5"/>
{%- elif name == "phone" -%}
<path d="M5 3.5h3.2l1.6 4.3-2.2 1.4a11 11 0 0 0 7.2 7.2l1.4-2.2 4.3 1.6V19a2 2 0 0 1-2 2A16.5 16.5 0 0 1 3 5.5a2 2 0 0 1 2-2z"/>
{%- elif name == "location" -%}
<path d="M12 21.5s-7-6.1-7-11.6a7 7 0 0 1 14 0c0 5.5-7 11.6-7 11.6z"/><circle cx="12" cy="9.8" r="2.6"/>
{%- elif name == "linkedin" -%}
<rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 10.5V17M8 7.2v.1M12 17v-6.5M12 13.3a2.8 2.8 0 0 1 5.5-.6V17"/>
{%- elif name == "github" -%}
<path d="M8.5 7 3.5 12l5 5M15.5 7l5 5-5 5M13.6 5l-3.2 14"/>
{%- elif name == "portfolio" -%}
<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5.5A1.5 1.5 0 0 1 10.5 4h3A1.5 1.5 0 0 1 15 5.5V7M3 12.5h18"/>
{%- elif name == "website" -%}
<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>
{%- else -%}
<path d="M10 14a4.2 4.2 0 0 0 6 0l3-3a4.2 4.2 0 0 0-6-6l-1 1M14 10a4.2 4.2 0 0 0-6 0l-3 3a4.2 4.2 0 0 0 6 6l1-1"/>
{%- endif -%}
</svg>
{%- endmacro -%}
